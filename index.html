<!DOCTYPE html>
<html>
<head>
  <title>Deep Work Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 2rem;
      color: #007BFF;
    }
    .big-number {
      font-size: 5em;
      margin-bottom: 1em;
    }
    canvas {
      max-width: 600px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="big-number" id="today-hours">--</div>
  <canvas id="workChart"></canvas>

  <script>
    fetch('work_summary.json')
      .then(response => response.json())
      .then(data => {
        const labels = Object.keys(data);
        const values = Object.values(data);

        // Display today's total work
        document.getElementById("today-hours").innerText = values[6] + " hrs";

        const ctx = document.getElementById('workChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Deep Work Hours',
              data: values,
              backgroundColor: '#007BFF'
            }]
          },
          options: {
            scales: {
              y: {
                beginAtZero: true,
                max: 8
              }
            }
          }
        });
      });
  </script>
</body>
</html>
