<!DOCTYPE html>
<html>
<head>
  <title>Deep Work Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 2rem;
      color: #007BFF;
    }
    .big-number {
      font-size: 4em;
      margin-bottom: 1em;
    }
canvas {
  display: block;
  margin: 0 auto;
  max-width: 60vw;
  width: 100%;
  height: auto;
}
  </style>
</head>
<body>
    <div class="big-number" id="today-hours">--</div>
    <div> Reap <i><b>DISPROPORTIONATE</b></i> rewards by learning fast, and producing fast and in quality! </div>
    <canvas id="workChart"></canvas>

  <script>
    fetch('work_summary.json')
      .then(response => response.json())
      .then(data => {
        const labels = Object.keys(data);
        const values = Object.values(data);

        // Display today's total work
        document.getElementById("today-hours").innerText = "Today: " + values[6] + " hrs";

        const ctx = document.getElementById('workChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Deep Work Hours For the Past 7 days',
              data: values,
              fill: true, 
              backgroundColor: 'rgba(0, 123, 255, 0.2)',
              borderColor: 'rgb(0, 123, 255)',
              pointBackgroundColor: 'rgb(0, 123, 255)',
            }]
          },
          options: {
            resposive: true,
            plugins: {
            annotation: {
              annotations: {
                sixHourLine: {
                  type: 'line',
                  yMin: 6,
                  yMax: 6,
                  borderColor: 'green',
                  borderWidth: 2,
                  borderDash: [6, 6],
                  label: {
                    content: 'Success!',
                    enabled: true,
                    position: 'start'
                  }
                }
              }
            }
          },
            scales: {
              y: {
                beginAtZero: true,
                max: 8
              }
            }
          }
        });
      });
  </script>
</body>
</html>
