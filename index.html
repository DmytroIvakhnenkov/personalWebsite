<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Deep Work Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

    <style>
      body {
        font-family: sans-serif;
        background-color: #f0f8ff;
        text-align: center;
        padding: 2rem;
        color: #007bff;
      }
      .big-number {
        font-size: 4em;
        margin-bottom: 0.1em;
      }
      .medium-number {
        font-size: 2em;
        margin-bottom: 0.5em;
      }
      canvas {
        display: block;
        margin: 0 auto;
        max-width: 60vw;
        width: 100%;
        height: auto;
      }
      #projects-list {
        text-align: left;
        display: inline-block;
        margin-top: 0.1em;
        font-size: 1.1em;
        color: #000000;
      }

      #projects-list li {
        margin-bottom: 0.6em;
      }

      body.dark-mode {
        background-color: #121212;
        color: #90caf9; /* lighter blue for contrast */
      }

      body.dark-mode #projects-list {
        color: #ddd;
      }
      body.dark-mode .big-number,
      body.dark-mode .medium-number {
        color: #90caf9;
      }
    </style>
  </head>
  <body>
    <div class="big-number" id="today-hours">--</div>
    <div class="medium-number" id="week-average">--</div>
    <div>
      Reap <i><b>DISPROPORTIONATE</b></i> rewards by learning fast, and
      producing fast and in quality!
    </div>
    <canvas id="workChart"></canvas>
    <div>
      <h2 style="margin-bottom: 0.1em">Current Projects</h2>
      <ol id="projects-list">
        <li>Verilog Agent for Chip IDE 🚀</li>
        <li>Squat Classification App 🏋️‍♂️</li>
        <li>PedometerAI 👟</li>
        <li>LLM inference UI in Kotlin 🧠</li>
        <li>Educational Accounting Tool 📚</li>
        <li>AI girlfriend in Kotlin 💘</li>
      </ol>
    </div>
    <script>
      function starCanvas() {
        const canvas = document.createElement("canvas");
        canvas.width = 24;
        canvas.height = 24;
        const ctx = canvas.getContext("2d");
        ctx.font = "20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("⭐", canvas.width / 2, canvas.height / 2);
        const img = new Image();
        img.src = canvas.toDataURL();
        return img;
      }
      async function initChart() {
        // Load background image and wait until it’s ready
        const image = new Image();
        image.src = "sisyphus_flipped.webp";
        await image.decode(); // <-- Waits for the image to be fully ready

        const response = await fetch("work_summary.json");
        const data = await response.json();

        const labels = Object.keys(data).map((dateStr) => {
          const date = new Date(dateStr);
          const day = date.toLocaleDateString(undefined, { weekday: "short" });
          const shortDate = date.toLocaleDateString(undefined, {
            month: "short",
            day: "numeric",
          });
          return [day, shortDate];
        });
        const values = Object.values(data);

        document.getElementById("today-hours").innerText =
          "Today: " + values[6] + " hrs";

        const average =
          (values.reduce((sum, val) => sum + val, 0) - values[6]) /
          (values.length - 1);
        document.getElementById("week-average").innerText =
          "Weekly average (excluding today): " + average.toFixed(2) + " hrs";

        const ctx = document.getElementById("workChart").getContext("2d");

        const backgroundImagePlugin = {
          id: "customBackgroundImage",
          beforeDraw: (chart) => {
            const {
              ctx,
              chartArea: { top, left, width, height },
            } = chart;
            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.drawImage(image, left, top, width, height);
            ctx.restore();
          },
        };

        Chart.register(backgroundImagePlugin);
        Chart.register(ChartDataLabels);

        new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Deep Work Hours For the Past 7 days",
                data: values,
                fill: true,
                backgroundColor: "rgba(0, 123, 255, 0.2)",
                borderColor: "rgb(0, 123, 255)",
                pointBackgroundColor: "rgb(0, 123, 255)",
                pointRadius: values.map((v) => (v >= 6 ? 14 : 5)), // bigger radius for star
                pointStyle: values.map((v) =>
                  v >= 6 ? starCanvas() : "circle"
                ),
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              tooltip: { enabled: false },
              datalabels: {
                align: "top",
                anchor: "end",
                color: "#007BFF",
                font: { weight: "bold" },
                formatter: (value) => value.toString(),
              },
              annotation: {
                annotations: {
                  sixHourLine: {
                    type: "line",
                    yMin: 6,
                    yMax: 6,
                    borderColor: "green",
                    borderWidth: 2,
                    borderDash: [6, 6],
                    label: {
                      content: "Success!",
                      enabled: true,
                      position: "end",
                    },
                  },
                },
              },
            },
            scales: {
              y: { beginAtZero: true, max: 8 },
            },
          },
          plugins: [backgroundImagePlugin],
        });
      }

      function applyDarkModeByTaiwanTime() {
        const localHour = new Date().getHours();
        // Get Taiwan time by adding 8 hours to UTC

        // Define dark mode hours (7pm to 6am)
        const isDark = localHour >= 19 || localHour < 6;

        if (isDark) {
          document.body.classList.add("dark-mode");
        } else {
          document.body.classList.remove("dark-mode");
        }
      }
      applyDarkModeByTaiwanTime();
      initChart();
    </script>
  </body>
</html>
