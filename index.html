<!DOCTYPE html>
<html>
<head>
  <title>Deep Work Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 2rem;
      color: #007BFF;
    }
    .big-number {
      font-size: 4em;
      margin-bottom: 0.1em;
    }
    .medium-number {
      font-size: 2em;
      margin-bottom: 0.5em;
    }
canvas {
  display: block;
  margin: 0 auto;
  max-width: 60vw;
  width: 100%;
  height: auto;
}
  </style>
</head>
<body>
    <div class="big-number" id="today-hours">--</div>
    <div class="medium-number" id="week-average">--</div>
    <div> Reap <i><b>DISPROPORTIONATE</b></i> rewards by learning fast, and producing fast and in quality! </div>
    <canvas id="workChart"></canvas>

  <script>
    fetch('work_summary.json')
      .then(response => response.json())
      .then(data => {
        const labels = Object.keys(data).map(dateStr =>{
          const date = new Date(dateStr);
          const day = date.toLocaleDateString(undefined, {weekday: 'short'});
          const shortDate = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          return [day, shortDate];
        });
        const values = Object.values(data);

        // Display today's total work
        document.getElementById("today-hours").innerText = "Today: " + values[6] + " hrs";
        
        //Display average for the past seven days
        const average = (values.reduce((sum, val) => sum + val, 0) - values[6]) / (values.length-1)
        document.getElementById("week-average").innerText = "Weekly average (exluding today): " + average.toFixed(2) + " hrs";

        const ctx = document.getElementById('workChart').getContext('2d');
        Chart.register(ChartDataLabels);

        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Deep Work Hours For the Past 7 days',
              data: values,
              fill: true, 
              backgroundColor: 'rgba(0, 123, 255, 0.2)',
              borderColor: 'rgb(0, 123, 255)',
              pointBackgroundColor: 'rgb(0, 123, 255)',
            }]
          },
          options: {
            responsive: true,
            plugins: {
              tooltip:{
                enabled: false
              },
              datalabels:{
                align: 'top',
                anchor: 'end',
                color: '#007BFF',
                font: {
                        weight: 'bold'
                      },
              formatter: function(value) {
return value.toString(); // Show the actual value
 }
            },
            annotation: {
              annotations: {
                sixHourLine: {
                  type: 'line',
                  yMin: 6,
                  yMax: 6,
                  borderColor: 'green',
                  borderWidth: 2,
                  borderDash: [6, 6],
                  label: {
                    content: 'Success!',
                    enabled: true,
                    position: 'end'
                  }
                }
              }
            }
          },
            scales: {
              y: {
                beginAtZero: true,
                max: 8
              }
            }
          }
        });
      });
  </script>
</body>
</html>
